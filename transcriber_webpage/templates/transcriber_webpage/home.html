<!DOCTYPE html>

<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<html lang="en">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'transcriber_webpage/css/style.css' %}">

    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Handlee&display=swap');
        .yellow-circle {
            background-color: rgb(209, 179, 100); /* Yellow Circle */
            color: white; /* White icon */
        }
        .yellow-text {
            color: rgb(209, 179, 100); /* Yellow color for text */
        }
    </style>
    
    <script>
        // Function to toggle sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Close sidebar when clicking outside (on the overlay)
        function closeSidebarOnOutsideClick() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (!sidebar.classList.contains('hidden')) {
                sidebar.classList.add('hidden');
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Function to toggle profile dropdown
        function toggleDropdown() {
            document.getElementById('profileDropdown').classList.toggle('hidden');
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Toggle Button for Sidebar (only visible on mobile and small screens) -->
    <button onclick="toggleSidebar()" class="p-3 bg-white-600 text-gray fixed top-4 left-4 z-50 lg:hidden">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Overlay to detect clicks outside of the sidebar -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-30 lg:hidden" onclick="closeSidebarOnOutsideClick()"></div>

    <!-- Sidebar and Main Container -->
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside id="sidebar" class="w-72 bg-white h-full p-5 shadow-md transform -translate-x-full lg:translate-x-0 transition-transform duration-300 fixed lg:static z-40 lg:flex-shrink-0 lg:block hidden">
            <!-- Profile Section -->
            <div class="flex items-center justify-between mb-10">
                <div class="flex items-center space-x-2">
                    <!-- Profile Icon -->
                    <div class="w-8 h-8 rounded-full bg-gray-400 flex items-center justify-center text-white font-semibold">
                        A
                    </div>
                    <div class="text-lg font-semibold">AKASH VERMA</div>
                </div>
                <button onclick="toggleDropdown()" class="focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-500">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>

                <!-- Profile Dropdown -->
                <div id="profileDropdown" class="absolute top-16 right-0 w-64 bg-white rounded-md shadow-lg p-4 hidden">
                    <div class="text-sm text-gray-600 mb-3">bsoni9122505056@gmail.com</div>
                    <div class="flex items-center mb-4">
                        <div class="w-10 h-10 rounded-full bg-gray-400 flex items-center justify-center text-white font-semibold">
                            A
                        </div>
                        <div class="ml-3">
                            <div class="font-semibold">AKASH VERMA</div>
                            <div class="text-sm text-gray-500">Lifetime: Entries: 18</div>
                        </div>
                    </div>
                    <ul class="space-y-2">
                        <li>
                            <a href="#" class="flex items-center space-x-2 text-gray-700 hover:text-black">
                                <span class="w-5 h-5 inline-block">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3.75h18m-9 0v16.5m6-16.5v10.5M9 3.75v10.5M6 14.25v6M18 14.25v6" />
                                    </svg>
                                </span>
                                <span>Purchase entry</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center space-x-2 text-gray-700 hover:text-black">
                                <span class="w-5 h-5 inline-block">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 10.5l-9-9-9 9M3 18.75V21h3M21 21v-2.25h-3" />
                                    </svg>
                                </span>
                                <span>Suggest & Explore Features</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center space-x-2 text-gray-700 hover:text-black">
                                <span class="w-5 h-5 inline-block">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25M12 9V5.25M18 9V5.25M15.75 18.75v-3.75M12 18.75v-3.75M18 18.75v-3.75M3 12h7.5M9.75 15.75l4.5-3.75-4.5-3.75" />
                                    </svg>
                                </span>
                                <span>Log out</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Sidebar Navigation -->
            <nav>
                <ul class="space-y-4 text-lg">
                    <li>
                        <a href="#" class="flex items-center justify-between bg-gray-200 text-gray-700 font-small rounded-md px-4">
                            <span><i class="fas fa-book text-sm mr-2"></i>New Entry</span>
                            <span class="text-sm text-gray-500">+</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center justify-between text-gray-700 font-small rounded-md hover:bg-gray-200 px-4">
                            <span><i class="fas fa-book text-sm mr-2"></i>All Entries</span>
                            <span class="text-sm text-gray-500">></span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-grow p-8 flex flex-col items-center">
            <!-- Status -->
            <div class="btn-container mb-8" id="status"> Click the Mic Icon to Start ..</div>
    
            <!-- Microphone Icon inside Yellow Circle (aligned towards the top) -->
            <div class="yellow-circle w-20 h-20 rounded-full flex items-center justify-center mb-24">
                <i class="fas fa-microphone fa-2x" id="mic-icon" onclick="toggleConnection()"></i>
            </div>
    
            <!-- Increased space between mic icon and the button -->
            <!-- Single Button -->
            <button class="bg-[rgb(209,179,100)] hover:bg-[rgb(189,159,80)] text-white font-bold py-2 px-8 rounded-full mt-8" onclick="askpermission()">
                Dialogue with AI
            </button>
    
            <div class="text-center space-y-4 mt-12 p-10">
                <!-- Container for new chats -->
                <div id="chat-container">
                    <!-- New chats will be dynamically inserted here -->
                </div>
            </div>
        </main>
    </div>
    {% load static %}
    <script type="text/javascript" src="{% static 'transcriber_webpage/javascript/script.js' %}"></script>
</body>
</html>
