<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry</title>
</head>
<body>
    <div class="container mx-auto p-8">
        <h1 class="text-xl font-bold mb-4">Edit Journal Entry</h1>
        <form method="POST">
            {% csrf_token %}
            <textarea name="journal_content" class="w-full h-64 p-4 rounded border border-gray-300 mb-4">{{ journal_entry.groq_response }}</textarea>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Save</button>
        </form>
    </div>
</body>
</html>
