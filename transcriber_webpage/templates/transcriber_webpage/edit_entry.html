{% extends "transcriber_webpage/base.html" %}
{% block style %}
    <style>
        /* Additional custom styles for the edit page */
        .container {
            max-width: 800px;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb; /* Blue border on focus */
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); /* Light blue shadow */
        }

        /* Smaller font and padding for mobile screens */
        @media (max-width: 640px) {
            h1 {
                font-size: 1.25rem; /* Smaller heading for mobile */
            }
            textarea {
                font-size: 0.875rem; /* Smaller font size for mobile */
                padding: 10px; /* Adjust padding for smaller screens */
            }
            button {
                font-size: 0.875rem; /* Smaller button text on mobile */
                padding: 10px 14px; /* Adjust button padding on mobile */
            }
        }
    </style>
    {% endblock style %}
    {% block content %}

    <div class="container mx-auto p-8 bg-white shadow-md rounded-lg mt-10">
        <h1 class="text-2xl font-bold text-gray-700 mb-6">Edit Journal Entry</h1>
        <form method="POST">
            {% csrf_token %}
            <textarea name="journal_content" class="w-full h-64 p-4 rounded border border-gray-300 mb-6 focus:border-blue-500 focus:ring-blue-500 focus:ring-2">{{ journal_entry.groq_response }}</textarea>
            <div class="flex justify-end">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition duration-300 ease-in-out shadow-lg">
                    Save
                </button>
            </div>
        </form>
    </div>

    {% endblock content %}
