{% extends "transcriber_webpage/base.html" %}
{% block style %}
<style>
    /* Custom CSS */
    body {
        background-color: #f5f5f5;
        height: 100%; /* Light gray for the body background */
        overflow: auto; 
    }

    .card {
        background-color: rgb(243, 244, 226); /* The desired page color */
        box-shadow: 0px 2px 12px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        width: 160px; /* Reduced width for small screens */
        height: 260px; /* Fixed height */
        overflow: hidden; /* Hide overflowing content */
        margin: 5px; /* Ensure there's spacing between cards */
    }

    @media (min-width: 640px) {
        .card {
            width: 180px; /* Wider cards for tablets */
            height: 280px;
        }
    }

    @media (min-width: 768px) {
        .card {
            width: 200px; /* Even wider cards for larger screens */
            height: 300px;
        }
    }
    @media (max-width: 420px) and (min-width: 200px) {
        .card {
            width: 130px; /* Shrink cards a bit more for better spacing */
            height: 250px; /* Adjust the height */
        }

        .grid {
            gap: 8px; /* Increase gap between cards to prevent sticking */
        }
    }

    .journal-entry {
        white-space: pre-line; /* Allows text to wrap and respect newlines */
    }

    .journal-entry {
        white-space: pre-line; /* Allows text to wrap and respect newlines */
    }
    
    main {
        overflow-y: auto; /* Ensure that the main content can scroll if it overflows */
        flex-grow: 1;     /* Let the main content area expand */
    }
    
    
</style>
<style>
    /* Enhanced Modal Styles */
    #entryModal {
        background: rgba(0, 0, 0, 0.75); /* Semi-transparent background */
        transition: all 0.3s ease; /* Smooth transition */
    }
    .bg-smoke-dark {
        background: rgba(0, 0, 0, 0.8); /* Modal overlay */
    }
    .bg-white {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Subtle shadow for depth */
        border-radius: 12px;
    }
    .journal-entry {
        font-size: 1rem;
        line-height: 1.6;
        color: #4a5568; /* Gray for better readability */
    }

    /* Buttons */
    .rounded {
        border-radius: 8px;
        transition: background-color 0.3s;
    }
    .bg-red-500:hover {
        background-color: #e53e3e;
    }
    .bg-blue-500:hover {
        background-color: #3182ce;
    }

    /* Card hover effect */
    .card:hover {
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); /* Slight hover shadow */
        transform: translateY(-5px); /* Slight lift effect */
        transition: all 0.3s ease-in-out;
    }
    .card p {
        margin-bottom: 0.5rem;
    }

    /* Print button */
    .bg-[rgb(209,179,100)] {
        box-shadow: 0px 4px 10px rgba(209, 179, 100, 0.4);
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .bg-[rgb(209,179,100)]:hover {
        background-color: #b18d58;
        box-shadow: 0px 6px 14px rgba(209, 179, 100, 0.6);
    }

    /* Responsive grid layout tweaks */
    @media (max-width: 420px) {
        .grid {
            gap: 12px; /* Better spacing for smaller screens */
        }
    }
</style>
<style>
    /* Modal Enhancements: Add gap at top and bottom */
    #entryModal .bg-white {
        padding: 20px;
        margin: 20px; /* Ensure the modal doesn't touch the screen edges */
        max-height: 90vh; /* Ensure the modal doesn't overflow the screen */
        overflow-y: auto; /* Allow scrolling if content exceeds modal height */
    }

    /* Enhanced Modal Text for Mobile */
    @media (max-width: 640px) {
        .journal-entry {
            font-size: 0.875rem; /* Smaller text on mobile (14px) */
        }
        .bg-white {
            padding: 16px;
            margin: 10px; /* Smaller margin for mobile */
        }
        button {
            font-size: 0.875rem; /* Adjust button font size on mobile */
            padding: 10px 14px; /* Adjust padding for buttons on smaller screens */
        }
    }

    /* Enhanced general padding and spacing */
    .rounded-lg {
        padding: 20px;
        margin: 20px;
    }
</style>

{% endblock style %}
{% block content %}
<!-- Modal Structure -->
<!-- Modal Structure with enhanced spacing -->
<div id="entryModal" class="fixed inset-0 hidden z-50 overflow-auto bg-smoke-dark flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg max-w-lg w-full transform transition-all duration-300 ease-out">
        <div id="entryContent" class="journal-entry text-gray-700 mb-6">
            <!-- Journal content will be inserted here -->
        </div>
        <div class="flex justify-between space-x-4">
            <button onclick="closeModal()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-6 rounded">Close</button>
            <button id="editButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">Edit</button>
        </div>
    </div>
</div>

<!-- Print it as book button -->
<button class="bg-[rgb(209,179,100)] hover:bg-[rgb(189,159,80)] text-white font-bold py-2 px-8 rounded-full mt-8 transition-all duration-300"
    onclick="askpermission()">
    Print it as book
</button>

<!-- Improved Card Layout -->
<div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 p-4">
    <!-- Loop over journal entries from context -->
    {% for entry in journal_entries %}
    <div class="card p-4 rounded-lg cursor-pointer shadow-sm hover:shadow-md transition-all duration-300"
        onclick="openEntryModal('{{ entry.id }}', '{{ entry.groq_response|escapejs }}')">
        <p class="text-gray-600 text-xs leading-relaxed journal-entry">
            {{ entry.groq_response|truncatechars:200 }} <!-- Show a preview, truncate to 100 characters -->
        </p>
        <p class="text-xs text-gray-500 mt-2">{{ entry.timestamp|date:"F d, Y H:i" }}</p>
    </div>
    {% endfor %}
</div>

{% endblock content %}
