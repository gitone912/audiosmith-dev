<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Redirecting</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8f9fa;
    }
    .error-container {
      text-align: center;
    }
    .error-title {
      font-size: 72px;
      font-weight: bold;
      color: #dc3545;
    }
    .error-message {
      font-size: 24px;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="container error-container">
    <h1 class="error-title">Thank You</h1>
    <p class="error-message">Your journal entry has been saved, redirecting you to all journals...</p>
  </div>

  <!-- Redirect Script -->
  <script>
    setTimeout(function() {
      window.location.href = "{% url "all_entries"%}"; // Replace with your desired URL
    }, 2000); // 2-second delay
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
