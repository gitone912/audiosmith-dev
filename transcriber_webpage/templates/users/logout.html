{% extends "users/base.html" %}
{% block title %}Logout{% endblock title %}
{% block content %}

        <div class="card shadow-lg border-0 rounded-lg" style="width: 24rem; padding: 20px;">
            <div class="card-body text-center">
                <h4 class="card-title mb-4">You have been logged out</h4>
                <p class="card-text text-muted mb-4">

                </p>
                <hr class="my-4">
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Sign in again</a>
            </div>
        </div>
    </div>
{% endblock content %}
